[project]
name = "bibliotech"
version = "1.3.0"
description = "Gestion d'une bibliothèque municipale (projet fil rouge Clean Code)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Familles du guide TP3 (E, W, F, B, S, C90, SIM) + I (imports triés) et N (noms PEP 8)
select = ["E", "W", "F", "B", "S", "C90", "SIM", "I", "N"]

[tool.ruff.lint.mccabe]
# Plus strict que le guide (10) : aucune fonction ne dépasse 5 aujourd'hui
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert est normal dans les tests
# Fichier fourni non modifiable : il lance bibliotech.py via sys.executable avec
# des arguments fixes, aucune entrée externe n'atteint subprocess.run
"tests/test_caracterisation.py" = ["S101", "S603"]
